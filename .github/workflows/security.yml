# Security checks
#
#   [ secrets scan ] --> [ dependency audit ] --> [ SBOM artifact ]
#
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Audit the project's OWN declared dependencies, resolved from
      # pyproject.toml. The audit tool runs via pipx so that its transitive
      # deps stay out of the audited set: installing pip-audit beside the
      # project is what turned this job red on filelock and setuptools,
      # neither of which LANTERN depends on.
      - run: pipx run pip-audit --strict .
      # SBOM of a project-only virtualenv, for the same reason.
      - run: python -m venv .sbomenv && .sbomenv/bin/pip install -e .
      - run: pipx run cyclonedx-bom environment .sbomenv -o sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
