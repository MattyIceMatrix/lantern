name: New requirement
description: Propose a testable "SHALL" requirement for docs/requirements.md
labels: [requirement]
body:
  - type: input
    id: statement
    attributes:
      label: Requirement statement
      placeholder: "The system SHALL ..."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale (which ConOps need does it serve?)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [MUST, SHOULD, COULD]
    validations:
      required: true
  - type: dropdown
    id: verify
    attributes:
      label: Verification method
      options: [TEST, DEMO, INSPECTION, ANALYSIS]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (how exactly do we check it?)
    validations:
      required: true
